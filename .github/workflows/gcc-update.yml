name: India GCC Intelligence Data Refresh

on:
  schedule:
    # Runs twice per day at 06:00 and 18:00 UTC (11:30 AM & 11:30 PM IST)
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    # Allows manual trigger at any time

permissions:
  contents: write

jobs:
  refresh-gcc-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run GCC Data Normalisation & Refresh
        run: node scripts/update-gcc-data.js

      - name: Validate Generated Dataset
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('gcc-tracker/gcc-data.json', 'utf8'));
            if (!data.records || data.records.length === 0) {
              console.error('Validation failure: records array is empty!');
              process.exit(1);
            }
            console.log('Validation passed: ' + data.records.length + ' GCC records verified.');
          "

      - name: Commit and push if data updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gcc-tracker/gcc-data.json
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "Automated twice-daily India GCC intelligence refresh"
            git push
          fi
